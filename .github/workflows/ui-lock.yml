name: Preserve approved UI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ui-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/ui_guard.py
      - run: git diff --check
